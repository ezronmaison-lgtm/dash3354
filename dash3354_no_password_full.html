<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Dashboard</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;font-size:14px}
header{padding:12px;background:#1b1b1b;border-bottom:1px solid #333}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#aaa;font-size:12px}
.wrap{padding:8px}
.stock{border:1px solid #444;border-radius:8px;margin:8px 0;overflow:hidden;background:#151515}
.stock-toggle{width:100%;border:0;background:#202020;color:#fff;text-align:left;padding:14px;font-size:16px;font-weight:bold}
.stock-body{display:none;padding:8px}
.row{display:flex;gap:8px;align-items:flex-start}
.left{width:42%}.right{width:58%}
.box{border:1px solid #444;border-radius:6px;padding:8px;margin-bottom:7px;background:#181818}
.label{font-size:11px;color:#aaa}.value{font-size:18px;margin-top:3px}
.tv{background:#181818;border:1px solid #333;border-radius:6px;overflow:hidden;margin-bottom:8px}
.tv iframe{width:100%;border:0;display:block}
.pos input,.pos select{box-sizing:border-box;width:100%;padding:9px;margin:4px 0;background:#222;color:#fff;border:1px solid #555;border-radius:4px;font-size:14px}
.pos button{padding:9px 12px;background:#333;color:#fff;border:1px solid #666;border-radius:4px}
.small{font-size:11px;color:#999;line-height:1.4}
.summary{padding:10px;border:1px solid #444;border-radius:6px;text-align:center;margin-bottom:8px}
.indicator-panel{position:relative;z-index:10;margin-bottom:8px}
.indicator-button{background:#202020;color:#fff;border:1px solid #555;border-radius:5px;padding:8px 10px;font-weight:bold;font-size:13px}
.indicator-menu{display:none;background:#101010;border:1px solid #555;border-radius:8px;padding:8px;margin-top:4px;width:245px;box-sizing:border-box}
.indicator-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;color:#eee;font-size:13px}
.indicator-name{padding-right:10px}



.apple-slider:before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.45)}


.indicator-note{font-size:10px;color:#888;margin-top:6px;line-height:1.35}
@media(max-width:600px){.row{display:block}.left,.right{width:100%}}

.greeting-card{margin:0 0 14px 0;padding:14px 15px;background:#151515;border:1px solid #303030;border-radius:14px}
.greeting-title{font-size:20px;font-weight:700;color:#fff}
.greeting-sub{font-size:12px;color:#888;margin-top:2px}
.greeting-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.greeting-stat{padding:11px 12px;background:#0f0f0f;border:1px solid #292929;border-radius:11px}
.greeting-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.35px}
.greeting-value{font-size:21px;font-weight:700;color:#fff;margin-top:3px}
.greeting-value.positive{color:#34c759}.greeting-value.negative{color:#ff453a}
.greeting-made-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:#fff;padding:0;text-align:left}
.greeting-chevron{font-size:16px;color:#888}
.manual-panel{display:none;margin-top:9px;padding-top:10px;border-top:1px solid #292929}
.manual-panel.open{display:block}
.manual-row{display:flex;gap:7px;align-items:center}
.manual-input{flex:1;min-width:0;background:#0b0b0b;border:1px solid #3a3a3a;border-radius:8px;color:#fff;padding:9px;font-size:14px}
.manual-btn{background:#202020;border:1px solid #444;color:#fff;border-radius:8px;padding:9px 11px;font-weight:600}
.manual-reset{margin-top:7px;background:transparent;border:0;color:#888;font-size:11px;padding:3px}
.position-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:#171717;border:1px solid #3a3a3a;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700;font-size:12px}
.position-toggle .chev{color:#999;font-size:15px}
.position-body{display:block}
.position-body.hidden{display:none}

/* Unified Apple-style switches for market and position dropdowns */



.apple-dropdown-switch.on .track{background:#34c759;border-color:#34c759}
.apple-dropdown-switch.on .knob{transform:translateX(17px)}
.stock-toggle{display:flex!important;align-items:center;justify-content:space-between;text-align:left}
.position-drop{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;cursor:pointer}

/* ONE unified Apple-style switch used everywhere */
.unified-switch{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 44px;box-sizing:border-box}
.unified-switch .switch-track{position:absolute;inset:0;background:#555;border:1px solid #666;border-radius:26px;box-sizing:border-box;transition:background .16s ease,border-color .16s ease}
.unified-switch .switch-knob{position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform .16s ease}
.unified-switch.on .switch-track{background:#34c759;border-color:#34c759}
.unified-switch.on .switch-knob{transform:translateX(18px)}

.chart-toggle-row{display:flex;align-items:center;justify-content:space-between;margin:7px 0 8px}
.chart-toggle-label{font-size:12px;font-weight:700;color:#fff}
.chart-wrap-hidden{display:none!important}
</style>

<style id="enter-today-style">
.today-editor{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.today-input{width:150px;box-sizing:border-box;padding:10px 12px;border:1px solid #d2d2d7;border-radius:12px;background:#fff;color:#111;font-size:16px;outline:none}
.today-input:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.today-reset{padding:10px 12px;border:0;border-radius:12px;background:#f2f2f7;color:#333;font-size:14px}
.today-hint{width:100%;font-size:12px;color:#8e8e93}
</style>


<style id="exact-mockup-style">
*{box-sizing:border-box}
body{
 margin:0!important;min-height:100vh;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif!important;
 background:var(--bg)!important;color:var(--text)!important;
 transition:background .25s,color .25s;
}
.greeting-card{
 position:relative;display:grid;grid-template-columns:1.15fr .9fr 1fr auto;
 gap:12px;align-items:center;margin:14px;padding:16px 18px;
 background:var(--panel)!important;border:1px solid var(--border)!important;
 border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.12);
}
.greeting-main{min-width:190px}
.greeting-title{font-size:28px;font-weight:750;letter-spacing:-.7px;color:var(--text)}
.greeting-sub{margin-top:4px;font-size:15px;color:var(--muted)}
.greeting-stat{min-height:74px;padding:12px 15px;border:1px solid var(--border);background:var(--panel2);border-radius:12px}
.greeting-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.greeting-value{font-size:23px;font-weight:750;color:var(--text)}
.greeting-value.positive{color:#24c77a}.greeting-value.negative{color:#ff4d5d}
.greeting-made-toggle{width:100%;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.greeting-chevron{color:var(--muted)}
.manual-panel{display:none;margin-top:10px}.manual-panel.open{display:block}
.manual-row{display:flex;align-items:center;gap:8px}
.manual-input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;font-size:14px}
.enter-hint{font-size:11px;color:var(--muted);white-space:nowrap}
.manual-reset{margin-top:7px;border:0;background:none;color:var(--muted);font-size:11px;padding:0;cursor:pointer}
.theme-picker-wrap{position:relative;justify-self:end;align-self:start}
.theme-button{width:42px!important;height:42px!important;border-radius:12px!important;background:var(--panel2)!important;color:var(--text)!important;border:1px solid var(--border)!important}
.wrap{padding:0 14px 20px!important}
.stock{
 margin:12px 0!important;border:1px solid var(--border)!important;border-radius:15px!important;
 overflow:hidden;background:var(--panel)!important;box-shadow:0 8px 26px rgba(0,0,0,.10)
}
.market-head{
 height:52px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;
 background:var(--panel2)!important;color:var(--text);cursor:pointer;font-size:16px;font-weight:750;
}
.market-name{letter-spacing:.1px}
.unified-switch{display:inline-flex!important;align-items:center;position:relative;width:46px!important;height:27px!important;min-width:46px!important;cursor:pointer}
.switch-track{position:absolute;inset:0;border-radius:999px;background:#8e8e93;transition:.2s}
.switch-knob{position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;left:3px;top:3px;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.unified-switch.on .switch-track{background:#2bd276}
.unified-switch.on .switch-knob{left:22px}
.stock-body{padding:13px!important;background:var(--panel)!important}
.market-topline{display:flex;gap:12px;align-items:stretch;margin-bottom:10px}
.price-panel{flex:1;min-width:190px;border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:12px}
.price-title{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2bd276;margin-left:4px}
.price-value{font-size:26px;font-weight:750;margin-top:4px}
.price-note{font-size:11px;color:var(--muted);margin-top:3px}
.ohlc-mini{display:grid;grid-template-columns:110px 1fr;gap:4px;margin-top:10px;font-size:11px}
.ohlc-mini span{color:var(--muted)}.ohlc-mini b{font-weight:600}
.market-actions{display:flex;flex-direction:column;gap:8px;justify-content:flex-start;min-width:150px}
.action-pill{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:9px 11px;border:1px solid var(--border);background:var(--panel2);border-radius:12px;font-size:11px;font-weight:700;cursor:pointer}
.action-pill .unified-switch{transform:scale(.82);transform-origin:right center;margin-left:0}
.position-area{margin-bottom:10px!important}
.position-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field-label{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px}
.pos input,.pos select{width:100%!important;padding:9px!important;background:var(--bg)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:8px!important}
.position-result{margin-top:9px;padding:9px;border-radius:9px;background:var(--bg);font-weight:700;text-align:center}
.calc-btn{margin-top:8px;padding:8px 12px;border:0;border-radius:8px;background:var(--accent2);color:#fff;font-weight:700;cursor:pointer}
.chart-card{border:1px solid var(--border);background:var(--panel2);border-radius:12px;overflow:hidden;margin-top:10px}
.chart-header{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;font-size:11px;font-weight:750}
.chart-sub{color:var(--muted)}
.tv{background:var(--bg)!important;border:0!important;border-radius:0!important;margin:0!important}
.tv iframe{width:100%;height:360px;border:0;display:block}
.indicator-panel{position:relative!important;margin:0 0 10px!important;padding:0!important;border:0!important;background:transparent!important}
.indicator-button{width:100%;padding:10px 12px!important;border:1px solid var(--border)!important;border-radius:10px!important;background:var(--panel2)!important;color:var(--text)!important;text-align:left!important;font-weight:700}
.indicator-menu{position:relative!important;background:var(--panel2)!important;border:1px solid var(--border)!important;border-radius:10px!important;margin-top:5px!important;padding:8px!important}
@media(max-width:800px){
 .greeting-card{grid-template-columns:1fr 1fr}.greeting-main{grid-column:1/3}.theme-picker-wrap{position:absolute;right:14px;top:14px}
 .market-topline{flex-direction:column}.market-actions{flex-direction:row}.action-pill{flex:1}.position-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
 .greeting-card{grid-template-columns:1fr 1fr;padding:13px}.greeting-title{font-size:23px}.greeting-stat{min-height:64px}
 .market-head{font-size:14px}.stock-body{padding:9px!important}.position-grid{grid-template-columns:1fr}
 .market-actions{min-width:0}.action-pill{font-size:10px}
 .tv iframe{height:300px}
}
</style>

<style id="final-ui-fixes">
/* ===== Theme system ===== */
:root{
  --bg:#f6dfe1;
  --panel:#fff1f2;
  --panel2:#ffe7e9;
  --text:#201416;
  --muted:#765b60;
  --accent:#e53e4b;
  --accent2:#c92e3a;
  --border:rgba(110,35,45,.20);
  --chartbg:#fff0f1;
  --chartText:#241619;
}
body.theme-soft-red{--bg:#f6dfe1;--panel:#fff1f2;--panel2:#ffe7e9;--text:#201416;--muted:#765b60;--accent:#e53e4b;--accent2:#c92e3a;--border:rgba(110,35,45,.20);--chartbg:#fff0f1;--chartText:#241619}
body.theme-ocean{--bg:#071b2a;--panel:#0d293c;--panel2:#123a52;--text:#f7fcff;--muted:#a4c0d0;--accent:#22d7b5;--accent2:#1597e8;--border:rgba(85,191,225,.20);--chartbg:#071b2a;--chartText:#f7fcff}
body.theme-purple{--bg:#170b23;--panel:#251236;--panel2:#32174a;--text:#fff9ff;--muted:#c5acd1;--accent:#d94cff;--accent2:#9b5cff;--border:rgba(217,76,255,.22);--chartbg:#170b23;--chartText:#fff9ff}
body.theme-emerald{--bg:#071713;--panel:#0d281f;--panel2:#12372b;--text:#f4fff9;--muted:#a1c5b5;--accent:#32dc83;--accent2:#16b86d;--border:rgba(50,220,131,.20);--chartbg:#071713;--chartText:#f4fff9}
body.theme-amber{--bg:#1d1308;--panel:#2b1b0b;--panel2:#3a250e;--text:#fff9ef;--muted:#d1b995;--accent:#ffb52e;--accent2:#f17c20;--border:rgba(255,181,46,.20);--chartbg:#1d1308;--chartText:#fff9ef}
body.theme-midnight{--bg:#080a0d;--panel:#11151a;--panel2:#191f26;--text:#f7f8fa;--muted:#9da5b0;--accent:#eef2f6;--accent2:#8d99a7;--border:rgba(255,255,255,.13);--chartbg:#080a0d;--chartText:#f7f8fa}
body.theme-rose{--bg:#32141f;--panel:#461c2c;--panel2:#5a233a;--text:#fff7fb;--muted:#d8aeba;--accent:#ff6f9d;--accent2:#e84e7e;--border:rgba(255,111,157,.20);--chartbg:#32141f;--chartText:#fff7fb}

body{background:var(--bg)!important;color:var(--text)!important;transition:background .25s,color .25s}
.greeting-card,.stock,.market-head,.box,.price-panel,.action-pill,.chart-card,.indicator-menu{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important}
.greeting-main{display:flex;flex-direction:column;align-items:flex-start}
.theme-picker-wrap{position:relative;margin-top:8px;z-index:10000}
.theme-button{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border)!important;
  background:var(--panel2)!important;color:var(--text)!important;border-radius:11px;
  padding:7px 10px!important;height:auto!important;width:auto!important;font-size:12px!important;
  font-weight:700;cursor:pointer
}
.theme-menu{
  display:none;position:absolute;left:0;top:39px;width:220px;padding:8px;
  background:var(--panel)!important;border:1px solid var(--border)!important;border-radius:14px;
  box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:10001
}
.theme-menu.open{display:block}
.theme-menu-title{font-size:12px;font-weight:800;color:var(--muted);padding:5px 7px 7px}
.theme-option{
  width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;
  color:var(--text);padding:9px 7px;border-radius:10px;text-align:left;font-size:13px;cursor:pointer
}
.theme-option:hover,.theme-option.active{background:var(--panel2)}
.theme-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:0 0 16px}
.theme-dot.red{background:#e53e4b}.theme-dot.blue{background:#1597e8}.theme-dot.purple{background:#d94cff}
.theme-dot.green{background:#32dc83}.theme-dot.amber{background:#ffb52e}.theme-dot.black{background:#8d99a7}.theme-dot.rose{background:#ff6f9d}

/* ===== Proper Apple switches: knob stays inside track ===== */
.unified-switch{position:relative!important;display:inline-block!important;width:46px!important;height:26px!important;min-width:46px!important;flex:0 0 46px!important;vertical-align:middle}
.unified-switch input{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  margin:0!important;padding:0!important;opacity:0!important;cursor:pointer!important;z-index:5!important;
}
.unified-switch .switch-track{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  box-sizing:border-box!important;background:#8e8e93!important;border:1px solid rgba(0,0,0,.10)!important;
  border-radius:999px!important;transition:.18s!important;
}
.unified-switch .switch-knob{
  position:absolute!important;width:20px!important;height:20px!important;left:3px!important;top:3px!important;
  margin:0!important;background:#fff!important;border-radius:50%!important;
  box-shadow:0 1px 4px rgba(0,0,0,.25)!important;transform:none!important;transition:.18s!important;z-index:2!important;
}
.unified-switch.on .switch-track{background:#34c759!important;border-color:#34c759!important}
.unified-switch.on .switch-knob{transform:translateX(20px)!important}
.unified-switch:not(.on) .switch-knob{transform:translateX(0)!important}

/* Indicator text: black on light theme, white on all dark themes */
.indicator-name,.indicator-row{font-weight:700!important;color:#111!important}
body:not(.theme-soft-red) .indicator-name,
body:not(.theme-soft-red) .indicator-row{color:#fff!important}
.indicator-button{color:var(--text)!important;background:var(--panel2)!important;border-color:var(--border)!important}

/* ===== Position section ===== */
.position-area{
  background:#141414!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;
}
.position-area .field-label{color:#fff!important;font-weight:800!important}
.position-area input,.position-area select{
  background:#141414!important;color:#fff!important;border:1px solid rgba(255,255,255,.82)!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);font-weight:600!important
}
.position-area input::placeholder{color:rgba(255,255,255,.60)!important}
.position-area .position-result{background:#141414!important;color:#fff!important;border:1px solid rgba(255,255,255,.30)!important}

/* ===== Made today: signed number only ===== */
.manual-input{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important}
.enter-hint{display:none!important}

/* Chart card follows theme */
.chart-card{background:var(--panel2)!important}
.tv{background:var(--chartbg)!important}
</style>

<script>
function togglePosition(btn){
  var body=btn.nextElementSibling, chev=btn.querySelector('.chev');
  if(!body) return;
  body.classList.toggle('hidden');
  if(chev) chev.textContent=body.classList.contains('hidden')?'›':'⌄';
}
function refreshTopPnl(){
  var total=0;
  if(window.stocks && Array.isArray(window.stocks)){
    window.stocks.forEach(function(s){
      var q=Number(s.qty||s.units||0), e=Number(s.open||s.entry||0), c=Number(s.current||s.price||0);
      if(q&&e&&c) total += (s.side==='SELL'||s.direction==='SELL') ? (e-c)*q : (c-e)*q;
    });
  }
  var el=document.getElementById('topCurrentPnl');
  if(el){
    el.textContent=(total<0?'−':'')+'£'+Math.abs(total).toFixed(2);
    el.className='greeting-value '+(total>0?'positive':total<0?'negative':'');
  }
}

<script>
(function(){
  var key='dash_manual_today';
  function day(){ return new Date().toISOString().slice(0,10); }
  function get(){
    try{
      var raw=localStorage.getItem(key);
      if(!raw) return {date:day(),value:0};
      var x=JSON.parse(raw);
      if(x.date!==day()) return {date:day(),value:0};
      return {date:day(),value:Number(x.value)||0};
    }catch(e){ return {date:day(),value:0}; }
  }
  function save(v){ try{localStorage.setItem(key,JSON.stringify({date:day(),value:v}));}catch(e){} updateManualTotal(); }
  window.updateManualTotal=function(){
    var x=get(), el=document.getElementById('topMadeToday');
    if(el) el.textContent=(x.value<0?'−':'')+'£'+Math.abs(x.value).toFixed(2);
  };
  window.toggleManualTotal=function(){
    var p=document.getElementById('manualPanel'), c=document.getElementById('manualChevron');
    if(!p) return;
    var open=p.classList.toggle('open');
    if(c) c.textContent=open?'⌃':'⌄';
  };
  window.applyManualAmount=function(){
    var i=document.getElementById('manualAmount');
    var raw=i&&i.value ? i.value.trim().replace(/£/g,'').replace(/,/g,'') : '';
    var v=Number(raw);
    if(!isFinite(v)) return;
    save(get().value+v);
    if(i) i.value='';
  };
  window.resetManualTotal=function(){ save(0); };
  updateManualTotal();
})();
</script>
<script>
var markets=[
 {id:'nq',name:'TECH100 / NASDAQ 100',tvSymbol:'OANDA:NAS100USD',tdSymbol:'NDX'},

];

/* Each market keeps its own indicator state. */
var indicatorState={
 nq:{fib:true,macd:false,trend:false},
 oil:{fib:true,macd:false,trend:false},
 gold:{fib:true,macd:false,trend:false},
 silver:{fib:true,macd:false,trend:false}
};

function tvQuote(symbol){
  var light=document.body.classList.contains('theme-soft-red');

  }));

}

function tvChart(symbol,id){
  var st=indicatorState[id];

  if(st.macd){studies.push('MACD');}

  var root=getComputedStyle(document.body);
  var bg=(root.getPropertyValue('--chartbg')||'').trim() || (light?'#ffe3e5':'#101820');
  var theme=light?'light':'dark';

  var config={
    autosize:true,
    symbol:symbol,
    interval:'30',
    timezone:'Etc/UTC',
    theme:theme,
    backgroundColor:bg,
    style:'1',
    locale:'en',
    enable_publishing:false,
    hide_top_toolbar:false,
    hide_legend:false,
    save_image:false,
    allow_symbol_change:false,
    hide_side_toolbar:!st.trend,
    studies:studies
  };
  var opt=encodeURIComponent(JSON.stringify(config));
  return '<iframe id="frame-'+id+'" height="360" scrolling="no" allowtransparency="true" frameborder="0" src="https://s.tradingview.com/embed-widget/advanced-chart/?locale=en#'+opt+'"></iframe>';
}

function indicatorMenu(id){

  s+=sw('trend','Trendline tools',st.trend);

  s+='<div class="market-name">'+m.name+'</div>';

  return s;
}

var positionPnl={};
var pnlReset=false;

function savePositionPnl(id,p,valid){
  positionPnl[id]=valid?Number(p)||0:0;
  try{localStorage.setItem('dash_position_pnl',JSON.stringify(positionPnl));}catch(e){}
}

function loadPositionPnl(){
  try{
    var x=JSON.parse(localStorage.getItem('dash_position_pnl')||'{}');
    if(x&&typeof x==='object') positionPnl=x;
  }catch(e){positionPnl={};}
}

function refreshTopPnl(){
  var total=0, k;
  if(!pnlReset){
    for(k in positionPnl){
      if(Object.prototype.hasOwnProperty.call(positionPnl,k)) total+=Number(positionPnl[k])||0;
    }
  }
  var el=document.getElementById('topCurrentPnl');
  if(el){
    el.textContent=(total<0?'−':'')+'£'+Math.abs(total).toFixed(2);
    el.className='greeting-value '+(total>0?'positive':total<0?'negative':'');
  }
}

function resetCurrentPnl(){
  pnlReset=true;
  positionPnl={};
  try{localStorage.setItem('dash_position_pnl','{}');}catch(e){}
  for(var i=0;i<markets.length;i++){
    var id=markets[i].id;
    var open=document.getElementById('open-'+id);
    var qty=document.getElementById('qty-'+id);
    var result=document.getElementById('sum-'+id);
    if(open) open.value='';
    if(qty) qty.value='';
    if(result){
      result.textContent='No position entered';
      result.style.color='';
    }
  }
  refreshTopPnl();
}

loadPositionPnl();

function render(){
  var a='',i;
  for(i=0;i<markets.length;i++){a+=makeMarket(markets[i]);}
  document.getElementById('app').innerHTML=a;
}

function toggleStock(id){
  var b=document.getElementById('body-'+id), sw=document.getElementById('sw-'+id);
  var open=b.style.display==='block';
  b.style.display=open?'none':'block';
  if(sw){sw.classList.toggle('on',!open);}
}

function toggleChart(id){
  var sw=document.getElementById('chart-sw-'+id);
  var nodes=document.querySelectorAll('#body-'+id+' iframe, #body-'+id+' .tradingview-widget-container, #body-'+id+' .chart, #body-'+id+' canvas');
  var currentlyOn=sw ? sw.classList.contains('on') : true;
  nodes.forEach(function(n){ n.style.display=currentlyOn?'none':''; });
  if(sw) sw.classList.toggle('on',!currentlyOn);
}

function togglePosition(id){
  var b=document.getElementById('pos-body-'+id), sw=document.getElementById('pos-sw-'+id);
  if(!b) return;
  var hidden=b.style.display==='none';
  b.style.display=hidden?'block':'none';
  if(sw) sw.classList.toggle('on',hidden);
}

function toggleIndicatorMenu(id){
  var m=document.getElementById('menu-'+id);
  if(m.style.display==='block'){m.style.display='none';}
  else{m.style.display='block';}
}

function setIndicator(id,type,enabled){
  indicatorState[id][type]=!!enabled;
  var sw=document.getElementById('ind-sw-'+id+'-'+type);
  if(sw) sw.classList.toggle('on',!!enabled);
  var cb=sw ? sw.querySelector('input') : null;
  if(cb) cb.checked=!!enabled;

  var market=null,i;
  for(i=0;i<markets.length;i++){
    if(markets[i].id===id){market=markets[i];break;}
  }
  if(!market){return;}
  var holder=document.getElementById('chart-'+id);
  if(holder){holder.innerHTML=tvChart(market.tvSymbol,id);}
}

function calc(id){
  var sideEl=document.getElementById('side-'+id);
  var openEl=document.getElementById('open-'+id);
  var qtyEl=document.getElementById('qty-'+id);
  var curEl=document.getElementById('cur-'+id);
  var el=document.getElementById('sum-'+id);
  if(!sideEl||!openEl||!qtyEl||!curEl||!el) return;

  var side=sideEl.value;
  var e=parseFloat(openEl.value);
  var q=parseFloat(qtyEl.value);
  var c=parseFloat(curEl.value);

  if(isNaN(e)||isNaN(q)||isNaN(c)||!isFinite(e)||!isFinite(q)||!isFinite(c)||q<=0){
    if((openEl.value||qtyEl.value) && !isNaN(c)){
      el.innerHTML='Enter open price and units';
    }else{
      el.innerHTML='No position entered';
    }
    savePositionPnl(id,0,false);
    refreshTopPnl();
    return;
  }

  var p=(side==='BUY'?(c-e):(e-c))*q;
  el.innerHTML=side+' • '+(p>=0?'+':'')+p.toFixed(2);
  el.style.color=p>=0?'#62d37d':'#ff6b6b';
  savePositionPnl(id,p,true);
  pnlReset=false;
  refreshTopPnl();
}

render();
refreshTopPnl();
setTimeout(function(){ if(window.bindPositionEnter) window.bindPositionEnter(); },0);
</script>


<script id="twelve-data-script">
(function(){
  /*
    Cloudflare Worker proxy.
    Set this to your deployed Worker URL, e.g.
    https://dash3354-prices.your-subdomain.workers.dev/prices
  */
  var PRICE_API='PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE';
  var REFRESH_MS=60000;

  function setStatus(id,text,kind){
    var el=document.getElementById('status-'+id);
    if(!el) return;
    el.textContent=text;
    el.className='td-live-status '+(kind||'');
  }

  function setPrice(id,price){
    var n=Number(price);
    if(!isFinite(n)) return;

    var priceEl=document.getElementById('price-'+id);
    var curEl=document.getElementById('cur-'+id);

    if(priceEl){
      priceEl.textContent=n.toLocaleString('en-GB',{
        minimumFractionDigits:2,
        maximumFractionDigits:5
      });
    }
    if(curEl) curEl.value=n;

    var updated=document.getElementById('updated-'+id);
    if(updated){
      updated.textContent='Updated '+new Date().toLocaleTimeString('en-GB',{
        hour:'2-digit',minute:'2-digit',second:'2-digit'
      });
    }

    setStatus(id,'Twelve Data • live/latest','live');
    calc(id);
  }

  function showError(id,message){
    setStatus(id,message||'Price feed unavailable','error');
  }

  function refreshPrices(){
    if(!PRICE_API || PRICE_API.indexOf('PASTE_')===0){
      markets.forEach(function(m){
        showError(m.id,'Connect Cloudflare price worker');
      });
      return;
    }

    fetch(PRICE_API,{cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('Worker HTTP '+r.status);
        return r.json();
      })
      .then(function(data){
        if(!data || data.status!=='ok'){
          var msg=(data&&data.message)||'Price worker error';
          markets.forEach(function(m){showError(m.id,msg);});
          return;
        }

        markets.forEach(function(m){
          var item=data.prices && data.prices[m.id];
          if(item && item.price!=null){
            setPrice(m.id,item.price);
          }else{
            showError(m.id,(item&&item.error)||('No price for '+m.name));
          }
        });
      })
      .catch(function(err){
        markets.forEach(function(m){
          showError(m.id,'Price worker connection error');
        });
      });
  }

  window.refreshTwelveData=refreshPrices;
  refreshPrices();
  window.setInterval(refreshPrices,REFRESH_MS);
})();
</script>

<script id="enter-today-script">
(function(){
  function getTodayKey(){
    var d=new Date();
    return "madeToday_"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function getTodayValue(){
    var n=parseFloat(localStorage.getItem(getTodayKey())||"0");
    return isFinite(n)?n:0;
  }
  function setTodayValue(v){
    localStorage.setItem(getTodayKey(),String(v));
    var el=document.getElementById("topMadeToday");
    if(el) el.textContent=(v<0?"-":"")+"£"+Math.abs(v).toFixed(2);
  }
  function submitToday(){
    var input=document.getElementById("manualAmount");
    if(!input) return;
    var raw=(input.value||"").trim().replace(/£/g,"").replace(/,/g,"");
    if(!raw) return;
    var amount=Number(raw);
    if(!isFinite(amount)) return;
    setTodayValue(getTodayValue()+amount);
    input.value="";
  }
  function resetManualTotal(){setTodayValue(0);}
  window.resetManualTotal=resetManualTotal;
  function bind(){
    setTodayValue(getTodayValue());
    var input=document.getElementById("manualAmount");
    if(input){
      input.addEventListener("keydown",function(e){
        if(e.key==="Enter" || e.keyCode===13){
          e.preventDefault(); submitToday();
        }
      });
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",bind,false);
  else bind();
})();
</script>


<script id="final-theme-script">
(function(){
  var themes=["soft-red","ocean","purple","emerald","amber","midnight","rose"];
  function chartThemeReload(){
    if(typeof markets==="undefined" || typeof tvChart!=="function") return;
    for(var i=0;i<markets.length;i++){
      var holder=document.getElementById("chart-"+markets[i].id);
      if(holder && holder.style.display!=="none") holder.innerHTML=tvChart(markets[i].symbol,markets[i].id);
    }
  }
  function applyTheme(name){
    if(themes.indexOf(name)<0) name="soft-red";
    themes.forEach(function(t){document.body.classList.remove("theme-"+t);});
    document.body.classList.add("theme-"+name);
    try{localStorage.setItem("dashboardTheme",name);}catch(e){}
    document.querySelectorAll(".theme-option").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-theme")===name);
    });
    setTimeout(chartThemeReload,30);
  }
  function init(){
    var saved="soft-red";
    try{saved=localStorage.getItem("dashboardTheme")||"soft-red";}catch(e){}
    applyTheme(saved);
    var button=document.getElementById("themeButton"), menu=document.getElementById("themeMenu"), wrap=document.getElementById("themePickerWrap");
    if(!button||!menu) return;
    button.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();menu.classList.toggle("open");});
    menu.querySelectorAll(".theme-option").forEach(function(o){
      o.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();applyTheme(o.getAttribute("data-theme"));menu.classList.remove("open");});
    });
    document.addEventListener("click",function(e){if(wrap&&!wrap.contains(e.target))menu.classList.remove("open");});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init,false);
  else init();
})();
</script>






<script id="position-enter-script">
(function(){
  window.bindPositionEnter=function(){
    if(typeof markets==="undefined") return;
    markets.forEach(function(m){
      ["open-"+m.id,"qty-"+m.id,"cur-"+m.id].forEach(function(id){
        var el=document.getElementById(id);
        if(!el || el.dataset.enterBound==="1") return;
        el.dataset.enterBound="1";
        el.addEventListener("keydown",function(e){
          if(e.key==="Enter" || e.keyCode===13){
            e.preventDefault();
            if(typeof calc==="function") calc(m.id);
          }
        },false);
      });
    });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",bindPositionEnter,false);
  else bindPositionEnter();
})();
</script>
